<title>qr code thingy</title>

<body style="background-color: black;">
    <input id="txt" oninput=updateqr(this.value) maxlength="78"><br>
    <canvas id="qr" style="background-color: white; width: 320px; height: 320px; image-rendering: pixelated;"></canvas>
</body>
<script>

    // galois field

    let expTable = new Array(512);
    let logTable = new Array(256);

    let value = 1;

    for (let i = 0; i < 255; i++) {
        expTable[i] = value;
        logTable[value] = i;

        value <<= 1;
        if (value & 256) value ^= 0x11D;
    }

    for (i = 255; i < 512; i++) expTable[i] = expTable[i - 255];

    function galoisMultiply(a, b) {
        if (a === 0 || b === 0) return 0;
        return expTable[logTable[a] + logTable[b]];
    }

    const qrcan = document.getElementById("qr");
    /** @type {CanvasRenderingContext2D} */
    const qrctx = qrcan.getContext("2d");

    function updateqr(text) {

        // reset
        qrctx.clearRect(0, 0, qrctx.canvas.width, qrctx.canvas.height)

        // version
        const inputBytes = new TextEncoder().encode(text);
        const byteLength = inputBytes.length;

        const ver = byteLength < 18 ? 1 : byteLength < 33 ? 2 : byteLength < 54 ? 3 : byteLength < 79 ? 4 : 0;  // V1=17B, V2=32B, V3=53B, V4=78B
        console.log(ver)

        if (ver === 0) return;

        // codewords
        const data_cw = [0, 19, 34, 55, 80][ver];
        const ec_cw = [0, 7, 10, 15, 20][ver];

        const size = 17 + 4 * ver;

        let bitBuffer = [];

        function pushBits(value, bitCount) {
            for (let k = bitCount - 1; k >= 0; k--) bitBuffer.push((value >> k) & 1);
        }

        pushBits(4, 4); // 0100, byte mode -> https://www.thonky.com/qr-code-tutorial/data-encoding#step-3-add-the-mode-indicator
        pushBits(byteLength, 8) // char count (8 bits for ver 1 -> 9)

        for (i = 0; i < byteLength; i++) pushBits(inputBytes[i], 8) // data

        pushBits(0, Math.min(4, data_cw * 8 - bitBuffer.length)) // https://www.thonky.com/qr-code-tutorial/data-encoding#add-a-terminator-of-0s-if-necessary

        while (bitBuffer.length % 8 !== 0) bitBuffer.push(0); // https://www.thonky.com/qr-code-tutorial/data-encoding#add-more-0s-to-make-the-length-a-multiple-of-8

        console.log(bitBuffer)

        let dataCodewords = [];

        for (i = 0; i < bitBuffer.length; i += 8) {
            let byteValue = 0;
            for (let j = 0; j < 8; j++) byteValue = byteValue * 2 + bitBuffer[i + j];
            dataCodewords.push(byteValue)
        }

        for (i = 0; dataCodewords.length < data_cw; i++) {
            dataCodewords.push(i % 2 === 0 ? 0xEC : 0x11);
        }

        // reed-solomon
        // https://www.thonky.com/qr-code-tutorial/error-correction-coding

        let generatorPoly = [1]; // (b²-4ac eheh)

        for (i = 0; i < ec_cw; i++) {
            let nextPoly = new Array(generatorPoly.length + 1).fill(0);
            for (j = 0; j < generatorPoly.length; j++) {
                nextPoly[j] ^= galoisMultiply(generatorPoly[j], expTable[i]);
                nextPoly[j + 1] ^= generatorPoly[j];
            }
            generatorPoly = nextPoly;
        }

        let ecCodewords = new Array(ec_cw).fill(0);
        for (i = 0; i < dataCodewords.length; i++) {
            const factor = dataCodewords[i] ^ ecCodewords.shift();
            ecCodewords.push(0);
            for (j = 0; j < ec_cw; j++) {
                ecCodewords[j] ^= galoisMultiply(generatorPoly[ec_cw - 1 - j], factor)
            }
        }

        const codewords = dataCodewords.concat(ecCodewords);

        console.log("cw", codewords)


        // static marker things or whatever they're called
        // https://www.thonky.com/qr-code-tutorial/module-placement-matrix

        const matrix = [];

        for (let row = 0; row < size; row++) {
            matrix.push([])
            for (let col = 0; col < size; col++) matrix[row].push(-1);
        }

        function drawMarker(centerRow, centerCol, radius) {
            const half = radius === 3 ? 4 : 2;

            for (let dr = -half; dr <= half; dr++) {
                for (let dc = -half; dc <= half; dc++) {
                    const r = centerRow + dc; // row coords
                    const c = centerCol + dr; // col coords

                    if (r < 0 || c < 0 || r >= size || c >= size) continue;

                    const dist = Math.max(Math.abs(dr), Math.abs(dc));

                    const isDark = (dist === radius) || (dist === 0) || (radius === 3 && dist === 1);
                    matrix[r][c] = isDark ? 1 : 0;
                }
            }
        }

        drawMarker(3, 3, 3);
        drawMarker(3, size - 4, 3);
        drawMarker(size - 4, 3, 3);

        for (i = 8; i < size - 8; i++) { // https://www.thonky.com/qr-code-tutorial/module-placement-matrix#step-4-add-the-timing-patterns
            matrix[6][i] = (i % 2 === 0) ? 1 : 0;
            matrix[i][6] = matrix[6][i]
        }

        const aliCenters = { 2: [6, 18], 3: [6, 22], 4: [6, 26] }[ver] || [];
        for (let a = 0; a < aliCenters.length; a++) {
            for (let b = 0; b < aliCenters.length; b++) {
                const aliRow = aliCenters[a];
                const aliCol = aliCenters[b];

                if ((aliRow === 6 && aliCol === 6) ||
                    (aliRow === 6 && aliCol === size - 7) ||
                    (aliRow === size - 7 && aliCol === 6)) continue;

                drawMarker(aliRow, aliCol, 2);

            }
        }


        // format info
        // https://www.thonky.com/qr-code-tutorial/format-version-information

        const formatData = 8; // 0b01000 (L + 000 mask, see https://www.thonky.com/qr-code-tutorial/format-version-information#the-error-correction-bits)

        let remainder = formatData;

        for (i = 0; i < 10; i++) {
            remainder = ((remainder << 1) ^ ((remainder >> 9) * 0x537)) & 32767;
        }

        const formatBits = ((formatData << 10) | remainder) ^ 0x5412;

        function getFormatBit(k) { return (formatBits >> k) & 1; }

        // write format bits
        for (i = 0; i < 6; i++) {
            matrix[i][8] = getFormatBit(i);
            matrix[8][size - 1 - i] = getFormatBit(i);
        }

        matrix[7][8] = matrix[8][size - 7] = getFormatBit(6);
        matrix[8][8] = matrix[8][size - 8] = getFormatBit(7);
        matrix[8][7] = getFormatBit(8);

        // write them again for redundancy
        for (i = 8; i < 15; i++) matrix[size - 15 + i][8] = getFormatBit(i);
        for (i = 9; i < 15; i++) matrix[8][14 - i] = getFormatBit(i);

        matrix[size-8][8] = 1; // https://www.thonky.com/qr-code-tutorial/format-version-information#dark-module




        // data placement (yaaay) zigzag (funny word btw)
        // https://www.thonky.com/qr-code-tutorial/module-placement-matrix#step-6-place-the-data-bits

        let bitIndex = 0;

        for (let rc = size - 1; rc >= 1; rc -= 2) {
            if (rc === 6) rc = 5; // col 6 is timing

            let up = ((rc + 1) & 2) === 0;

            for (let vertical = 0; vertical < size; vertical++) {
                for (j = 0; j < 2; j++) {
                    const c2 = rc - j;
                    const r2 = up ? size - 1 - vertical : vertical;

                    if (matrix[r2][c2] >= 0) continue; // cell already occupied (!= -1)
                    
                    let dataBit = (codewords[bitIndex >> 3] >> (7 - (bitIndex & 7))) & 1;

                    if (((c2 + r2) & 1) === 0) dataBit ^= 1; //mask

                    matrix[r2][c2] = dataBit;
                    bitIndex++;
                }
            }
        }



        // drawing the actual qr code

        console.log(matrix)

        console.log(size)

        const quiet = 2; // should be 4 but doesn't look good :)

        qrcan.width = size + quiet * 2
        qrcan.height = qrcan.width

        qrctx.fillStyle = "black";
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                if (matrix[r][c]) qrctx.fillRect(c + quiet, r + quiet, 1, 1);
            }
        }
    }
</script>
